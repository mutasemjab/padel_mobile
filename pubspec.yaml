name: padel
description: "Padel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # DI
  get_it: ^8.0.2

  # Navigation
  go_router: ^14.3.0

  # Utils
  fpdart: ^1.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.2

  # Push notifications
  firebase_core: ^4.4.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0
  fl_chart: ^1.2.0
  model_viewer_plus: ^1.10.0
  dart_pusher_channels: ^1.3.1
  crypto: ^3.0.7
  country_picker: ^2.0.28
  video_player: ^2.11.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  build_runner: ^2.4.13
  freezed: ^3.0.4
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_async: ^1.3.3
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
flutter:
  # CocoaPods is used for iOS plugins so Xcode does not resolve the generated
  # Flutter SPM package at its default iOS 13 target before Flutter can raise
  # it to the Firebase-required iOS 15 target.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true

  assets:
     - assets/
     # Playmaker login fonts, bundled so the first screen never waits on
     # a download (google_fonts picks these up by file name).
     - assets/fonts/
